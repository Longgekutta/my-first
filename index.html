<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级贪吃蛇 - 新颖玩法</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- 主菜单 -->
        <div id="main-menu" class="menu-screen active">
            <div class="menu-content">
                <h1 class="game-title">
                    <span class="neon-text">超级贪吃蛇</span>
                    <div class="subtitle">SUPER SNAKE</div>
                </h1>
                
                <div class="game-modes">
                    <button class="mode-btn" data-mode="classic">
                        <span class="mode-icon">🐍</span>
                        <span class="mode-name">经典模式</span>
                        <span class="mode-desc">传统的贪吃蛇游戏</span>
                    </button>
                    
                    <button class="mode-btn" data-mode="speed">
                        <span class="mode-icon">⚡</span>
                        <span class="mode-name">竞速模式</span>
                        <span class="mode-desc">速度递增，挑战反应</span>
                    </button>
                    
                    <button class="mode-btn" data-mode="obstacle">
                        <span class="mode-icon">🧱</span>
                        <span class="mode-name">障碍模式</span>
                        <span class="mode-desc">躲避障碍物</span>
                    </button>
                    
                    <button class="mode-btn" data-mode="infinite">
                        <span class="mode-icon">♾️</span>
                        <span class="mode-name">无限模式</span>
                        <span class="mode-desc">穿墙无限世界</span>
                    </button>
                </div>
                
                <div class="menu-buttons">
                    <button id="settings-btn" class="menu-btn secondary">⚙️ 设置</button>
                    <button id="leaderboard-btn" class="menu-btn secondary">🏆 排行榜</button>
                </div>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div id="game-screen" class="game-screen">
            <div class="game-header">
                <div class="game-info">
                    <div class="score-display">
                        <span class="label">分数</span>
                        <span id="score" class="value">0</span>
                    </div>
                    <div class="level-display">
                        <span class="label">等级</span>
                        <span id="level" class="value">1</span>
                    </div>
                    <div class="speed-display">
                        <span class="label">速度</span>
                        <span id="speed" class="value">1x</span>
                    </div>
                </div>
                
                <div class="game-controls">
                    <button id="pause-btn" class="control-btn">⏸️</button>
                    <button id="menu-btn" class="control-btn">🏠</button>
                </div>
            </div>
            
            <div class="game-area">
                <canvas id="gameCanvas" width="800" height="600"></canvas>
                
                <!-- 道具显示 -->
                <div class="powerup-display">
                    <div id="active-powerups" class="active-powerups"></div>
                </div>
                
                <!-- 粒子效果容器 -->
                <div id="particles-container" class="particles-container"></div>
            </div>
            
            <!-- 移动端控制 -->
            <div class="mobile-controls">
                <div class="direction-pad">
                    <button class="dir-btn" data-dir="up">↑</button>
                    <div class="middle-row">
                        <button class="dir-btn" data-dir="left">←</button>
                        <button class="dir-btn" data-dir="right">→</button>
                    </div>
                    <button class="dir-btn" data-dir="down">↓</button>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn" id="boost-btn">🚀 加速</button>
                    <button class="action-btn" id="brake-btn">🛑 减速</button>
                </div>
            </div>
        </div>

        <!-- 游戏结束界面 -->
        <div id="game-over" class="menu-screen">
            <div class="menu-content">
                <h2 class="game-over-title">游戏结束</h2>
                <div class="final-stats">
                    <div class="stat">
                        <span class="stat-label">最终分数</span>
                        <span id="final-score" class="stat-value">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">最高等级</span>
                        <span id="final-level" class="stat-value">1</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">游戏时长</span>
                        <span id="game-time" class="stat-value">0:00</span>
                    </div>
                </div>
                
                <div class="menu-buttons">
                    <button id="restart-btn" class="menu-btn primary">🔄 重新开始</button>
                    <button id="back-menu-btn" class="menu-btn secondary">🏠 返回主菜单</button>
                </div>
            </div>
        </div>

        <!-- 设置界面 -->
        <div id="settings-screen" class="menu-screen">
            <div class="menu-content">
                <h2>游戏设置</h2>
                
                <div class="settings-group">
                    <h3>音效设置</h3>
                    <div class="setting-item">
                        <label>音效音量</label>
                        <input type="range" id="sound-volume" min="0" max="100" value="70">
                        <span class="range-value">70%</span>
                    </div>
                    <div class="setting-item">
                        <label>背景音乐</label>
                        <input type="range" id="music-volume" min="0" max="100" value="50">
                        <span class="range-value">50%</span>
                    </div>
                </div>
                
                <div class="settings-group">
                    <h3>游戏设置</h3>
                    <div class="setting-item">
                        <label>初始难度</label>
                        <select id="difficulty">
                            <option value="easy">简单</option>
                            <option value="normal" selected>普通</option>
                            <option value="hard">困难</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>网格显示</label>
                        <input type="checkbox" id="show-grid" checked>
                    </div>
                </div>
                
                <div class="menu-buttons">
                    <button id="save-settings-btn" class="menu-btn primary">💾 保存设置</button>
                    <button id="back-settings-btn" class="menu-btn secondary">← 返回</button>
                </div>
            </div>
        </div>

        <!-- 排行榜界面 -->
        <div id="leaderboard-screen" class="menu-screen">
            <div class="menu-content">
                <h2>排行榜</h2>
                
                <div class="leaderboard-tabs">
                    <button class="tab-btn active" data-mode="classic">经典</button>
                    <button class="tab-btn" data-mode="speed">竞速</button>
                    <button class="tab-btn" data-mode="obstacle">障碍</button>
                    <button class="tab-btn" data-mode="infinite">无限</button>
                </div>
                
                <div class="leaderboard-list" id="leaderboard-list">
                    <!-- 排行榜内容将通过JavaScript生成 -->
                </div>
                
                <div class="menu-buttons">
                    <button id="clear-scores-btn" class="menu-btn danger">🗑️ 清除记录</button>
                    <button id="back-leaderboard-btn" class="menu-btn secondary">← 返回</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
